# Kiểm thử, biên dịch chéo và phát hành lên GitHub Release, đồng thời đẩy image Docker đa kiến trúc lên ghcr.io. Hai cách phát hành:
#   1. Đẩy tag: git tag v0.1.0 && git push origin v0.1.0
#   2. Kích hoạt thủ công: trang Actions chọn release → Run workflow → điền số phiên bản; hoặc gh workflow run release.yml -f version=v0.1.0
#      sẽ tạo tag trên commit mới nhất của nhánh đã chọn
# Định dạng số phiên bản vX.Y.Z, bản phát hành có hậu tố (như v0.2.0-rc1) là bản tiền phát hành.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Số phiên bản, ví dụ v0.1.0"
        required: true

permissions:
  contents: write

env:
  # Truyền cho script qua biến môi trường, không ghép trực tiếp vào run, tránh ký tự đặc biệt trong input bị coi là lệnh để thực thi
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check version
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Định dạng số phiên bản phải là vX.Y.Z hoặc vX.Y.Z-rc1, nhận được $TAG"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG đã tồn tại"; exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          # Biên dịch bằng bản vá mới nhất dòng 1.25, kèm bản vá bảo mật của thư viện chuẩn; 1.25.5 trong go.mod chỉ là phiên bản tối thiểu.
          # gVisor phụ thuộc vào triển khai nội bộ của runtime, trước khi nâng phiên bản lớn của Go phải nâng gVisor trước
          go-version: "1.25"
          check-latest: true
      - run: go vet ./... && go test -race -count=1 ./...
      - name: build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 linux/arm linux/386 linux/riscv64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" -o "dist/he-ipv6-pool-${target%/*}-${target#*/}" .
          done
          cd dist && sha256sum -- * > SHA256SUMS
      - name: release
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --generate-notes $prerelease
        env:
          GH_TOKEN: ${{ github.token }}

  # Phát hành image đặt trong cùng workflow: khi kích hoạt thủ công, tag do GITHUB_TOKEN tạo sẽ không kích hoạt workflow khác;
  # needs đảm bảo chỉ đẩy sau khi kiểm thử đạt và xác thực số phiên bản đạt
  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # v1.2.3 → 1.2.3, 1.2; bản chính thức gắn thêm latest, bản tiền phát hành chỉ gắn số phiên bản đầy đủ
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Gói mới tạo trên GHCR mặc định là riêng tư. Dùng API để đổi gói thành công khai, thất bại không ảnh hưởng phát hành (có thể đổi thủ công trong Package settings)
      - name: make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg="${GITHUB_REPOSITORY#*/}"
          for i in 1 2 3 4 5; do
            if gh api --method PATCH "/user/packages/container/${pkg%/}" -f visibility=public >/dev/null 2>&1; then
              echo "Đã đặt ${pkg} thành công khai"; exit 0
            fi
            sleep 5
          done
          echo "::warning::Không thể tự động đặt thành công khai, vui lòng vào https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${pkg%/}/settings để sửa thủ công"
