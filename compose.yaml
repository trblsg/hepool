# Cách dùng: cp .env.example .env, điền .env theo trang chi tiết tunnel HE, rồi docker compose up -d
# Tường lửa của máy chủ phải cho phép giao thức 41 từ HE_SERVER và cổng TCP của PROXY_LISTEN (trong container không có lệnh install)
services:
  he-ipv6-pool:
    image: ghcr.io/wsyqhh/he-ipv6-pool:${IMAGE_TAG:-latest}
    container_name: he-ipv6-pool
    restart: unless-stopped
    # Bắt buộc: giao thức 41 không có cổng, đi qua NAT của Docker sẽ mất gói do xung đột conntrack
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    environment:
      HE_SERVER: ${HE_SERVER:?Vui lòng điền HE_SERVER vào .env (Server IPv4 Address trên trang chi tiết tunnel)}
      HE_PREFIXES: ${HE_PREFIXES:?Vui lòng điền HE_PREFIXES vào .env (Routed /64, /48, phân tách bằng dấu phẩy)}
      HE_LOCAL: ${HE_LOCAL:-}
      HE_MTU: ${HE_MTU:-1480}
      PROXY_LISTEN: ${PROXY_LISTEN:?Vui lòng điền PROXY_LISTEN vào .env, ví dụ :24601}
      PROXY_USER: ${PROXY_USER:?Vui lòng điền PROXY_USER vào .env}
      PROXY_PASS: ${PROXY_PASS:?Vui lòng điền PROXY_PASS vào .env, có thể tạo bằng openssl rand -hex 16}
      LOG_LEVEL: ${LOG_LEVEL:-info}
